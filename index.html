<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 시스템 생성기 — Design Studio</title>
<meta name="description" content="사이트 URL에서 폰트·컬러·타이포그래피를 추출해 디자인 시스템으로 조정하고 WordPress 빌더(Bricks·Elementor·GreenShift·Divi·Builderius)용으로 내보내는 도구">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234c8dff'/%3E%3Ccircle cx='24' cy='24' r='9' fill='%23fff'/%3E%3Crect x='36' y='36' width='16' height='16' rx='5' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app">

  <header id="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Design Studio</span>
      <span class="brand-sub">디자인 시스템 생성기</span>
    </div>
    <form id="url-form" class="url-form" autocomplete="off">
      <input id="url-input" type="text" placeholder="https://example.com — 사이트 URL을 입력하세요" spellcheck="false">
      <button type="submit" class="btn btn-accent" id="btn-fetch">가져오기</button>
      <button type="button" class="btn btn-ghost" id="btn-paste" title="페이지 소스 직접 붙여넣기">소스 붙여넣기</button>
    </form>
    <div class="header-actions">
      <span id="source-badge" class="source-badge" hidden></span>
      <button type="button" class="btn btn-ghost" id="btn-save" title="project.json 저장">저장</button>
      <button type="button" class="btn btn-ghost" id="btn-open" title="project.json 열기">열기</button>
      <span class="v-divider"></span>
      <button type="button" class="btn btn-primary" id="btn-export">내보내기</button>
    </div>
  </header>

  <main id="app-main">

    <aside id="side-panel">
      <nav id="side-nav" aria-label="섹션"></nav>
      <div id="adjust-pane" class="adjust-pane"></div>
    </aside>

    <section id="preview-pane">
      <div id="pv-toolbar">
        <div class="pv-title">
          <span id="pv-project-name">샘플 프로젝트</span>
          <span id="pv-source-url" class="pv-source-url"></span>
        </div>
        <div class="pv-toolbar-actions">
          <div class="seg" id="vp-seg" role="tablist" aria-label="뷰포트">
            <button type="button" class="seg-btn is-active" data-viewport="desktop" title="데스크톱 크기로 보기">🖥</button>
            <button type="button" class="seg-btn" data-viewport="tablet" title="태블릿 크기로 보기">📱T</button>
            <button type="button" class="seg-btn" data-viewport="phone" title="모바일 크기로 보기">📱M</button>
          </div>
          <div class="seg" id="theme-seg" role="tablist" aria-label="미리보기 테마">
            <button type="button" class="seg-btn is-active" data-theme="light">라이트</button>
            <button type="button" class="seg-btn" data-theme="dark">다크</button>
          </div>
        </div>
      </div>
      <div id="pv-scroll">
        <div id="pv-canvas" data-theme="light"></div>
      </div>
    </section>

  </main>

</div>

<div id="toast-area" aria-live="polite"></div>
<div id="modal-root"></div>
<input type="file" id="file-json" accept=".json,application/json" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
